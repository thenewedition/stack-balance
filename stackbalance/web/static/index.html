<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Balance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='9' width='12' height='3' rx='1' fill='%232a78d6'/%3E%3Crect x='3.5' y='5' width='9' height='3' rx='1' fill='%232a78d6'/%3E%3Crect x='5' y='1' width='6' height='3' rx='1' fill='%23e34948'/%3E%3C/svg%3E">
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --income: #2a78d6;      /* categorical slot 1 (validated) */
    --expense: #e34948;     /* categorical slot 6 (validated) */
    --seq: #2a78d6;         /* sequential hue: blue 450 */
    --meter-track: #cde2fb; /* blue 100 — lighter step of same ramp */
    --meter-fill: #2a78d6;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --income: #3987e5;
      --expense: #e66767;
      --seq: #3987e5;
      --meter-track: #104281;
      --meter-fill: #3987e5;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 18px 24px 6px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--text-muted); font-size: 13px; }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  main { padding: 12px 24px 48px; max-width: 1180px; margin: 0 auto; }
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .two-col { grid-template-columns: 3fr 2fr; }
  @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--text-secondary); }
  .tile .label { font-size: 12px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tile .value.negative { color: var(--expense); }
  .hero .value { font-size: 48px; }
  .hero .value.long { font-size: 32px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-muted); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 12px; min-width: 130px;
  }
  .tooltip .t-title { color: var(--text-muted); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tooltip .t-row .k { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tooltip .t-row .line-key { width: 10px; height: 2px; display: inline-block; border-radius: 1px; }
  .tooltip .t-row .v { font-weight: 600; color: var(--text-primary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px;
       border-bottom: 1px solid var(--grid); padding: 4px 8px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .neg { color: var(--expense); }
  .pos-delta { color: var(--good-text); }
  .meter { height: 10px; border-radius: 5px; background: var(--meter-track); overflow: hidden; margin: 6px 0 2px; }
  .meter > div { height: 100%; background: var(--meter-fill); border-radius: 5px; }
  .fund { margin-bottom: 14px; }
  .fund .top, .fund .bottom { display: flex; justify-content: space-between; font-size: 12px; }
  .fund .top { font-size: 13px; color: var(--text-primary); }
  .fund .bottom { color: var(--text-muted); }
  button, input[type=file]::file-selector-button {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--baseline); }
  input.alloc {
    width: 90px; text-align: right; font: inherit; font-size: 13px;
    background: var(--page); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px;
    font-variant-numeric: tabular-nums;
  }
  details summary { cursor: pointer; color: var(--text-muted); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--page); padding: 8px 16px;
    border-radius: 8px; font-size: 13px; display: none; z-index: 20;
  }
</style>
</head>
<body>
<header>
  <h1>Stack Balance</h1>
  <span class="sub" id="month-label"></span>
  <div class="actions">
    <button id="btn-recurring" title="Post all due recurring transactions">Run recurring</button>
    <button id="btn-backup" title="Create a portable backup zip">Backup now</button>
    <a id="api-link" href="/docs" style="align-self:center;font-size:12px;color:var(--text-muted)">API docs</a>
  </div>
</header>

<main>
  <div class="row kpis" id="kpi-row"></div>

  <div class="row two-col">
    <div class="card">
      <h2>Cash flow — last 12 months</h2>
      <div class="legend">
        <span class="key"><span class="swatch" style="background:var(--income)"></span>Income</span>
        <span class="key"><span class="swatch" style="background:var(--expense)"></span>Spending</span>
      </div>
      <div id="cashflow-chart"></div>
      <details><summary>Data table</summary><div id="cashflow-table"></div></details>
    </div>
    <div class="card">
      <h2>Spending by category — this month</h2>
      <div id="spending-chart"></div>
    </div>
  </div>

  <div class="row two-col">
    <div class="card">
      <h2>Budget — this month <span style="font-weight:400;color:var(--text-muted)">(edit “Assigned”, Enter to save)</span></h2>
      <div id="budget-table"></div>
    </div>
    <div class="card">
      <h2>Sinking funds</h2>
      <div id="funds"></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h2>Recent transactions</h2>
      <div id="txn-table"></div>
    </div>
  </div>
</main>

<div class="tooltip" id="tooltip"></div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NOW = new Date();
const MONTH = `${NOW.getFullYear()}-${String(NOW.getMonth() + 1).padStart(2, "0")}`;
$("month-label").textContent = NOW.toLocaleDateString(undefined, { month: "long", year: "numeric" });

const fmt = (cents) => {
  const sign = cents < 0 ? "−" : "";
  return sign + "$" + (Math.abs(cents) / 100).toLocaleString(undefined,
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtCompact = (cents) => {
  const value = Math.abs(cents) / 100;
  const sign = cents < 0 ? "−" : "";
  if (value >= 1_000_000) return sign + "$" + (value / 1_000_000).toFixed(1) + "M";
  if (value >= 10_000) return sign + "$" + (value / 1000).toFixed(1) + "K";
  return sign + "$" + value.toLocaleString(undefined, { maximumFractionDigits: 0 });
};

async function api(path, options) {
  const response = await fetch("/api" + path, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail ? JSON.stringify(body.detail) : response.statusText);
  }
  if (response.status === 204) return null;
  return response.json();
}

function el(tag, attrs = {}, ...children) {
  const node = tag.includes(":svg")
    ? document.createElementNS("http://www.w3.org/2000/svg", tag.replace(":svg", ""))
    : document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child) node.append(child);
  return node;
}
const svgEl = (tag, attrs, ...kids) => el(tag + ":svg", attrs, ...kids);

function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.style.display = "block";
  clearTimeout(node._t);
  node._t = setTimeout(() => (node.style.display = "none"), 2600);
}

/* ---------- tooltip (shared, textContent only) ---------- */
const tooltip = $("tooltip");
function showTooltip(event, title, rows) {
  tooltip.replaceChildren(el("div", { class: "t-title", text: title }));
  for (const row of rows) {
    const key = el("span", { class: "k" });
    if (row.color) key.append(el("span", { class: "line-key", style: `background:${row.color}` }));
    key.append(document.createTextNode(row.label));
    tooltip.append(el("div", { class: "t-row" }, key, el("span", { class: "v", text: row.value })));
  }
  tooltip.style.display = "block";
  const pad = 14;
  const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + width > innerWidth - 8) x = event.clientX - width - pad;
  if (y + height > innerHeight - 8) y = event.clientY - height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
const hideTooltip = () => (tooltip.style.display = "none");

/* ---------- KPI tiles ---------- */
function tile(label, value, hint, options = {}) {
  const long = options.hero && value.length > 9 ? " long" : "";
  const valueNode = el("div", { class: "value" + long + (options.negative ? " negative" : ""), text: value });
  return el("div", { class: "card tile" + (options.hero ? " hero" : "") },
    el("div", { class: "label", text: label }), valueNode,
    hint ? el("div", { class: "hint", text: hint }) : null);
}

async function renderKpis() {
  const [budget, burn] = await Promise.all([
    api(`/budget/${MONTH}`), api("/reports/burn-rate?window_days=30"),
  ]);
  const tbb = budget.to_be_budgeted_cents;
  const runway = burn.runway_days === null ? "∞"
    : burn.runway_days > 365 ? "1 yr+" : burn.runway_days + " days";
  const runwayHint = burn.runway_date ? "funds last until " + burn.runway_date : "no burn detected";
  $("kpi-row").replaceChildren(
    tile("To be budgeted", fmt(tbb),
      tbb === 0 ? "every dollar has a job" : tbb > 0 ? "assign it below to reach zero" : "over-assigned — pull some back",
      { hero: true, negative: tbb < 0 }),
    tile("Liquid balance", fmt(burn.liquid_balance_cents), "on-budget accounts"),
    tile("Daily burn", fmt(burn.daily_burn_cents), "avg spend, last 30 days"),
    tile("Runway", runway, runwayHint),
  );
}

/* ---------- cash flow chart (grouped columns) ---------- */
function niceStep(maxValue, ticks = 4) {
  const rough = maxValue / ticks;
  const power = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  for (const multiplier of [1, 2, 2.5, 5, 10]) {
    if (rough <= multiplier * power) return multiplier * power;
  }
  return 10 * power;
}

async function renderCashFlow() {
  const data = (await api("/reports/cash-flow?months=12")).months;
  const width = 640, height = 240, top = 12, bottom = 26, left = 52, right = 8;
  const plotW = width - left - right, plotH = height - top - bottom;
  const maxValue = Math.max(100, ...data.map(m => Math.max(m.income_cents, -m.expense_cents)));
  const step = niceStep(maxValue);
  const yMax = Math.ceil(maxValue / step) * step;
  const y = (v) => top + plotH - (v / yMax) * plotH;

  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, width: "100%", role: "img",
    "aria-label": "Monthly income and spending, last 12 months" });

  for (let tick = 0; tick <= yMax; tick += step) {
    svg.append(svgEl("line", { x1: left, x2: width - right, y1: y(tick), y2: y(tick),
      stroke: tick === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": 1 }));
    svg.append(svgEl("text", { x: left - 6, y: y(tick) + 4, "text-anchor": "end",
      text: fmtCompact(tick) }));
  }

  const band = plotW / data.length;
  const gap = 2, groupPad = Math.max(band * 0.18, 6);
  const barW = Math.min(24, (band - groupPad * 2 - gap) / 2);
  const incomeColor = getComputedStyle(document.documentElement).getPropertyValue("--income").trim();
  const expenseColor = getComputedStyle(document.documentElement).getPropertyValue("--expense").trim();

  data.forEach((m, i) => {
    const x0 = left + i * band;
    const cx = x0 + band / 2;
    const bars = [
      { v: m.income_cents, color: "var(--income)", x: cx - gap / 2 - barW },
      { v: -m.expense_cents, color: "var(--expense)", x: cx + gap / 2 },
    ];
    for (const bar of bars) {
      if (bar.v <= 0) continue;
      const barTop = y(bar.v), barH = y(0) - barTop;
      const r = Math.min(4, barH); // rounded data-end, square baseline
      svg.append(svgEl("path", {
        d: `M${bar.x},${y(0)} V${barTop + r} Q${bar.x},${barTop} ${bar.x + r},${barTop}` +
           ` H${bar.x + barW - r} Q${bar.x + barW},${barTop} ${bar.x + barW},${barTop + r} V${y(0)} Z`,
        fill: bar.color,
      }));
    }
    if (i % 2 === 0 || data.length <= 6) {
      const d = new Date(m.month + "-15");
      const label = d.toLocaleDateString(undefined, { month: "short" }) +
        (m.month.endsWith("-01") || i === 0 ? " ’" + m.month.slice(2, 4) : "");
      svg.append(svgEl("text", { x: cx, y: height - 8, "text-anchor": "middle", text: label }));
    }
    // hit target: the whole month band
    const hit = svgEl("rect", { x: x0, y: top, width: band, height: plotH + bottom,
      fill: "transparent" });
    const monthName = new Date(m.month + "-15").toLocaleDateString(undefined, { month: "short", year: "numeric" });
    hit.addEventListener("pointermove", (event) => showTooltip(event, monthName, [
      { label: "Income", value: fmt(m.income_cents), color: incomeColor },
      { label: "Spending", value: fmt(m.expense_cents), color: expenseColor },
      { label: "Net", value: fmt(m.net_cents) },
    ]));
    hit.addEventListener("pointerleave", hideTooltip);
    svg.append(hit);
  });

  $("cashflow-chart").replaceChildren(svg);

  const table = el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { text: "Month" }), el("th", { class: "num", text: "Income" }),
      el("th", { class: "num", text: "Spending" }), el("th", { class: "num", text: "Net" }))),
    el("tbody", {}, ...data.map(m => el("tr", {},
      el("td", { text: m.month }),
      el("td", { class: "num", text: fmt(m.income_cents) }),
      el("td", { class: "num", text: fmt(m.expense_cents) }),
      el("td", { class: "num" + (m.net_cents < 0 ? " neg" : ""), text: fmt(m.net_cents) })))));
  $("cashflow-table").replaceChildren(table);
}

/* ---------- spending by category (horizontal bars, sequential hue) ---------- */
async function renderSpending() {
  const rows = await api(`/reports/spending/${MONTH}`);
  const host = $("spending-chart");
  if (!rows.length) {
    host.replaceChildren(el("div", { class: "empty", text: "No spending recorded this month yet." }));
    return;
  }
  const top = rows.slice(0, 8);
  const maxSpend = Math.max(...top.map(r => -r.spent_cents));
  const rowH = 30, labelW = 130, valueW = 66, width = 460;
  const barMax = width - labelW - valueW;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${top.length * rowH}`, width: "100%",
    role: "img", "aria-label": "Spending by category this month" });
  top.forEach((row, i) => {
    const yMid = i * rowH + rowH / 2;
    const barLen = Math.max((-row.spent_cents / maxSpend) * barMax, 2);
    svg.append(svgEl("text", { x: labelW - 8, y: yMid + 4, "text-anchor": "end",
      fill: "var(--text-secondary)", text: row.name }));
    const bar = svgEl("path", {
      d: `M${labelW},${yMid - 8} H${labelW + barLen - 4} Q${labelW + barLen},${yMid - 8} ${labelW + barLen},${yMid - 4}` +
         ` V${yMid + 4} Q${labelW + barLen},${yMid + 8} ${labelW + barLen - 4},${yMid + 8} H${labelW} Z`,
      fill: "var(--seq)",
    });
    svg.append(bar);
    svg.append(svgEl("text", { x: labelW + barLen + 6, y: yMid + 4,
      fill: "var(--text-secondary)", text: fmtCompact(-row.spent_cents) }));
    const hit = svgEl("rect", { x: 0, y: i * rowH, width, height: rowH, fill: "transparent" });
    hit.addEventListener("pointermove", (event) =>
      showTooltip(event, row.name, [{ label: "Spent", value: fmt(-row.spent_cents) }]));
    hit.addEventListener("pointerleave", hideTooltip);
    svg.append(hit);
  });
  host.replaceChildren(svg);
}

/* ---------- budget table with editable allocations ---------- */
async function renderBudget() {
  const budget = await api(`/budget/${MONTH}`);
  const spendRows = budget.categories.filter(c => !c.is_income);
  if (!spendRows.length) {
    $("budget-table").replaceChildren(el("div", { class: "empty",
      text: "No categories yet. Create category groups and categories via the API (see /docs)." }));
    return;
  }
  const body = el("tbody");
  let currentGroup = null;
  for (const row of spendRows) {
    if (row.group !== currentGroup) {
      currentGroup = row.group;
      body.append(el("tr", {}, el("td", { colspan: "4",
        style: "color:var(--text-muted);font-size:12px;border-bottom:none;padding-top:10px",
        text: currentGroup })));
    }
    const input = el("input", {
      class: "alloc", type: "text", value: (row.allocated_cents / 100).toFixed(2),
      "aria-label": `Assigned to ${row.name}`,
    });
    input.addEventListener("keydown", async (event) => {
      if (event.key !== "Enter") return;
      const dollars = parseFloat(input.value.replace(/[$,]/g, ""));
      if (Number.isNaN(dollars)) { toast("Enter a number"); return; }
      try {
        await api("/budget/allocations", {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ month: MONTH, category_id: row.category_id,
                                 amount_cents: Math.round(dollars * 100) }),
        });
        toast(`Assigned ${fmt(Math.round(dollars * 100))} to ${row.name}`);
        refreshAll();
      } catch (error) { toast("Save failed: " + error.message); }
    });
    body.append(el("tr", {},
      el("td", { text: row.name }),
      el("td", { class: "num" }, input),
      el("td", { class: "num" + (row.activity_cents < 0 ? " neg" : ""), text: fmt(row.activity_cents) }),
      el("td", { class: "num" + (row.available_cents < 0 ? " neg" : ""), text: fmt(row.available_cents) })));
  }
  $("budget-table").replaceChildren(el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { text: "Category" }), el("th", { class: "num", text: "Assigned" }),
      el("th", { class: "num", text: "Activity" }), el("th", { class: "num", text: "Available" }))),
    body));
}

/* ---------- sinking funds (meters) ---------- */
async function renderFunds() {
  const funds = await api("/sinking-funds");
  const host = $("funds");
  if (!funds.length) {
    host.replaceChildren(el("div", { class: "empty",
      text: "No sinking funds yet. POST /api/sinking-funds to add one." }));
    return;
  }
  host.replaceChildren(...funds.map(fund => {
    const pace = fund.suggested_monthly_cents !== null && fund.remaining_cents > 0
      ? `${fmt(fund.suggested_monthly_cents)}/mo to hit ${fund.target_date}` : (fund.target_date || "");
    return el("div", { class: "fund" },
      el("div", { class: "top" },
        el("span", { text: fund.name }),
        el("span", { text: `${fmt(fund.saved_cents)} / ${fmt(fund.target_cents)}` })),
      el("div", { class: "meter" },
        el("div", { style: `width:${Math.min(fund.percent_complete, 100)}%` })),
      el("div", { class: "bottom" },
        el("span", { text: fund.percent_complete + "%" }),
        el("span", { text: pace })));
  }));
}

/* ---------- recent transactions ---------- */
async function renderTransactions() {
  const [txns, accounts, categories] = await Promise.all([
    api("/transactions?limit=15"), api("/accounts"), api("/categories"),
  ]);
  const accountName = Object.fromEntries(accounts.map(a => [a.id, a.name]));
  const categoryName = Object.fromEntries(categories.map(c => [c.id, c.name]));
  if (!txns.length) {
    $("txn-table").replaceChildren(el("div", { class: "empty",
      text: "No transactions yet. Add one via POST /api/transactions or import a CSV via POST /api/import." }));
    return;
  }
  const rows = txns.map(txn => {
    const categoryLabel = txn.splits.length > 1
      ? `${txn.splits.length}-way split: ` + txn.splits.map(s => categoryName[s.category_id] || "—").join(", ")
      : (categoryName[txn.splits[0]?.category_id] || "—");
    return el("tr", {},
      el("td", { text: txn.date }),
      el("td", { text: accountName[txn.account_id] || "?" }),
      el("td", { text: txn.payee || "—" }),
      el("td", { text: categoryLabel }),
      el("td", { class: "num" + (txn.amount_cents < 0 ? " neg" : ""), text: fmt(txn.amount_cents) }),
      el("td", { text: txn.cleared ? "✓" : "" }));
  });
  $("txn-table").replaceChildren(el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { text: "Date" }), el("th", { text: "Account" }), el("th", { text: "Payee" }),
      el("th", { text: "Category" }), el("th", { class: "num", text: "Amount" }),
      el("th", { text: "Cleared" }))),
    el("tbody", {}, ...rows)));
}

/* ---------- header actions ---------- */
$("btn-recurring").addEventListener("click", async () => {
  try {
    const result = await api("/recurring/run", { method: "POST" });
    toast(result.posted ? `Posted ${result.posted} recurring transaction(s)` : "Nothing due");
    if (result.posted) refreshAll();
  } catch (error) { toast("Failed: " + error.message); }
});
$("btn-backup").addEventListener("click", async () => {
  try {
    const backup = await api("/backups", { method: "POST" });
    toast(`Backup saved: ${backup.filename}`);
    window.open(`/api/backups/${encodeURIComponent(backup.filename)}`, "_blank");
  } catch (error) { toast("Backup failed: " + error.message); }
});

function refreshAll() {
  renderKpis(); renderCashFlow(); renderSpending();
  renderBudget(); renderFunds(); renderTransactions();
}
refreshAll();
</script>
</body>
</html>
